<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vánoční přání 🎄</title>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.08), transparent 35%),
        linear-gradient(135deg, #0d2b22, #143f30 55%, #3b171d);
      overflow-x: hidden;
    }

    /* SNÍH */
    .snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .snow span {
      position: absolute;
      top: -20px;
      color: white;
      font-size: 14px;
      opacity: .8;
      animation: fall linear infinite;
    }

    .snow span:nth-child(1) { left: 5%; animation-duration: 8s; }
    .snow span:nth-child(2) { left: 15%; animation-duration: 11s; font-size: 20px; }
    .snow span:nth-child(3) { left: 25%; animation-duration: 9s; }
    .snow span:nth-child(4) { left: 35%; animation-duration: 13s; font-size: 18px; }
    .snow span:nth-child(5) { left: 45%; animation-duration: 10s; }
    .snow span:nth-child(6) { left: 55%; animation-duration: 12s; font-size: 22px; }
    .snow span:nth-child(7) { left: 65%; animation-duration: 8s; }
    .snow span:nth-child(8) { left: 75%; animation-duration: 14s; font-size: 19px; }
    .snow span:nth-child(9) { left: 85%; animation-duration: 10s; }
    .snow span:nth-child(10) { left: 95%; animation-duration: 12s; }

    @keyframes fall {
      0% {
        transform: translateY(-30px) rotate(0deg);
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    /* SVĚTÝLKA */
    .lights {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: center;
      gap: 18px;
      padding: 18px 10px 8px;
    }

    .bulb {
      width: 11px;
      height: 16px;
      border-radius: 50%;
      background: #f5d98b;
      box-shadow: 0 0 14px #f5d98b;
      animation: blink 1.5s infinite alternate;
    }

    .bulb:nth-child(2n) {
      animation-delay: .5s;
    }

    .bulb:nth-child(3n) {
      animation-delay: 1s;
    }

    @keyframes blink {
      from {
        opacity: .35;
        transform: scale(.9);
      }
      to {
        opacity: 1;
        transform: scale(1.1);
      }
    }

    /* HLAVNÍ */
    .container {
      position: relative;
      z-index: 2;
      width: min(92%, 680px);
      margin: 35px auto 50px;
      padding: 34px 28px 38px;
      background: rgba(10, 36, 28, .91);
      border: 1px solid rgba(245, 217, 139, .65);
      border-radius: 24px;
      box-shadow:
        0 20px 70px rgba(0, 0, 0, .4),
        inset 0 0 40px rgba(255, 255, 255, .02);
      backdrop-filter: blur(8px);
    }

    .tree {
      text-align: center;
      font-size: 55px;
      margin-bottom: 5px;
    }

    h1 {
      text-align: center;
      margin: 0;
      color: #f5d98b;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.1;
      text-shadow: 0 2px 20px rgba(245, 217, 139, .2);
    }

    .subtitle {
      text-align: center;
      color: #fff;
      opacity: .9;
      font-size: 16px;
      margin: 14px 0 30px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 0 0 8px;
      color: #f5d98b;
      font-weight: bold;
      font-size: 15px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(245, 217, 139, .35);
      border-radius: 12px;
      background: #fdfaf0;
      color: #26382e;
      padding: 14px 15px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: .2s;
    }

    input:focus,
    textarea:focus {
      border-color: #f5d98b;
      box-shadow: 0 0 0 3px rgba(245, 217, 139, .12);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .field {
      margin-bottom: 22px;
    }

    /* TIPY */
    .suggestions-title {
      color: #f5d98b;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .chip {
      border: 1px solid rgba(245, 217, 139, .45);
      background: rgba(255,255,255,.07);
      color: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      transition: .2s;
    }

    .chip:hover {
      background: #f5d98b;
      color: #173c30;
      transform: translateY(-1px);
    }

    /* TLAČÍTKO */
    button[type="submit"] {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #c43d42, #9d292f);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(164, 43, 49, .35);
      transition: .2s;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(164, 43, 49, .5);
    }

    button[type="submit"]:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    /* ZPRÁVA */
    .message {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: rgba(49, 137, 87, .2);
      border: 1px solid rgba(100, 220, 150, .5);
      color: #d9ffe5;
    }

    .error {
      display: block;
      background: rgba(180, 45, 45, .2);
      border: 1px solid rgba(255, 120, 120, .5);
      color: #ffdede;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: rgba(255,255,255,.65);
      font-size: 12px;
    }

    /* MOBIL */
    @media (max-width: 600px) {
      .container {
        width: 94%;
        margin-top: 22px;
        padding: 27px 18px 30px;
        border-radius: 20px;
      }

      .lights {
        gap: 12px;
      }

      .bulb {
        width: 9px;
        height: 13px;
      }

      .tree {
        font-size: 46px;
      }

      h1 {
        font-size: 31px;
      }

      .subtitle {
        font-size: 14px;
      }

      .chip {
        font-size: 12px;
        padding: 8px 10px;
      }

      input,
      textarea {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- SNÍH -->
  <div class="snow">
    <span>❄</span>
    <span>❄</span>
    <span>❅</span>
    <span>❄</span>
    <span>❆</span>
    <span>❄</span>
    <span>❅</span>
    <span>❄</span>
    <span>❆</span>
    <span>❄</span>
  </div>

  <!-- SVĚTÝLKA -->
  <div class="lights">
    <div class="bulb"></div>
    <div class="bulb"></div>
    <div class="bulb"></div>
    <div class="bulb"></div>
    <div class="bulb"></div>
    <div class="bulb"></div>
    <div class="bulb"></div>
    <div class="bulb"></div>
    <div class="bulb"></div>
    <div class="bulb"></div>
    <div class="bulb"></div>
    <div class="bulb"></div>
  </div>

  <main class="container">

    <div class="tree">🎄</div>

    <h1>Co si přeješ k Vánocům?</h1>

    <p class="subtitle">
      Napiš své vánoční přání a pošli ho přímo do vánoční schránky 🎅✨
    </p>

    <form id="wishForm">

      <!-- EMAIL -->
      <div class="field">
        <label for="email">📧 E-mail příjemce</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="např. mamka@email.cz"
          required
        >
      </div>

      <!-- PŘÁNÍ -->
      <div class="field">

        <label for="wish">🎁 Tvoje vánoční přání</label>

        <div class="suggestions-title">
          💡 Oblíbené tipy na dárky 2026
        </div>

        <div class="suggestions">

          <button type="button" class="chip" data-wish="Nike ponožky">
            Nike ponožky
          </button>

          <button type="button" class="chip" data-wish="GTA 6">
            GTA 6
          </button>

          <button type="button" class="chip" data-wish="EA SPORTS FC 27">
            EA SPORTS FC 27
          </button>

          <button type="button" class="chip" data-wish="V-Bucks">
            V-Bucks
          </button>

          <button type="button" class="chip" data-wish="nový mobil">
            nový mobil
          </button>

          <button type="button" class="chip" data-wish="sluchátka">
            sluchátka
          </button>

          <button type="button" class="chip" data-wish="PlayStation 5">
            PlayStation 5
          </button>

          <button type="button" class="chip" data-wish="dárková karta">
            dárková karta
          </button>

        </div>

        <textarea
          id="wish"
          name="wish"
          placeholder="Napiš sem své vánoční přání..."
          required
        ></textarea>

      </div>

      <button type="submit" id="sendButton">
        🎁 Odeslat přání
      </button>

      <div id="message" class="message"></div>

    </form>

    <div class="footer">
      🎄 Veselé Vánoce a šťastný nový rok! 🎄
    </div>

  </main>

  <script>
    /*
      EMAILJS NASTAVENÍ
    */

    emailjs.init({
      publicKey: "jIUojnByTUucVMEws"
    });


    /*
      TIPY NA DÁRKY
    */

    const wishTextarea = document.getElementById("wish");

    document.querySelectorAll(".chip").forEach(chip => {

      chip.addEventListener("click", () => {

        const text = chip.dataset.wish;

        if (wishTextarea.value.trim() === "") {
          wishTextarea.value = text;
        } else {
          wishTextarea.value += ", " + text;
        }

        wishTextarea.focus();
      });

    });


    /*
      ODESLÁNÍ PŘÁNÍ
    */

    const form = document.getElementById("wishForm");
    const message = document.getElementById("message");
    const sendButton = document.getElementById("sendButton");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const wish = document.getElementById("wish").value.trim();

      if (!email || !wish) {
        showMessage(
          "❌ Vyplň prosím e-mail a vánoční přání.",
          "error"
        );
        return;
      }

      sendButton.disabled = true;
      sendButton.textContent = "🎅 Odesílám přání...";

      message.className = "message";
      message.textContent = "";

      try {

        await emailjs.send(
          "service_dxwiiqi",
          "template_u5b5cey",
          {
            to_email: email,
            wish: wish
          }
        );

        showMessage(
          "🎄 Přání bylo úspěšně odesláno! Krásné Vánoce! 🎁",
          "success"
        );

        form.reset();

      } catch (error) {

        console.error("EmailJS chyba:", error);

        showMessage(
          "❌ Přání se nepodařilo odeslat. Zkontroluj prosím nastavení EmailJS.",
          "error"
        );

      } finally {

        sendButton.disabled = false;
        sendButton.textContent = "🎁 Odeslat přání";

      }

    });


    /*
      ZOBRAZENÍ ZPRÁVY
    */

    function showMessage(text, type) {

      message.textContent = text;
      message.className = "message " + type;

    }
  </script>

</body>
</html>
